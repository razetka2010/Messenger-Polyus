<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071735">
    <title>Конфиденциальность — Полюс</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/privacy.js" defer></script>
  </head>
  <body class="privacy-page">
    <main class="privacy-card">
      <a class="brand privacy-brand" href="/">
        <img class="brand-logo" src="/logo.svg" alt="">
        <span>ПОЛЮС<span class="brand-dot">.</span></span>
      </a>
      <label class="language-control privacy-language">
        <span class="visually-hidden">Language</span>
        <select id="privacy-language" class="language-select" aria-label="Language">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </label>
      <article id="privacy-content" class="privacy-content"></article>
    </main>
  </body>
</html>
